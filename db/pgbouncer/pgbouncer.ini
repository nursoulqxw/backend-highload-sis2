; PgBouncer: many client connections -> few real Postgres connections.
;
; Without it: 8 server processes x 2 APIs x 10 pool = 160 connections > max_connections 100.
; Each real Postgres connection is a whole OS process (~5-10 MB). With transaction pooling a
; server connection is busy only during a transaction; between transactions it serves others.
; (PgBouncer allows comments only on their own lines.)

[databases]
counters    = host=postgres         port=5432 dbname=counters
counters_ro = host=postgres-replica port=5432 dbname=counters

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; may open the admin console: psql -p 6432 pgbouncer -c 'SHOW POOLS'
admin_users = postgres

pool_mode = transaction

; app connections PgBouncer accepts
max_client_conn = 2000

; real Postgres connections per database (primary / replica)
default_pool_size = 30
reserve_pool_size = 5

; hard limit of server connections per database, whatever happens (max_connections is 100;
; the rest is left for the sync worker, benchmarks and admin logins)
max_db_connections = 40

; a client waits at most 1 s for a free server connection, then gets an error (no endless queue)
query_wait_timeout = 1

; asyncpg uses prepared statements; PgBouncer (1.21+) tracks them per server connection
max_prepared_statements = 500

; not needed in transaction mode
server_reset_query =
ignore_startup_parameters = extra_float_digits
