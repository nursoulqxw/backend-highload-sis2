# SIS #3 tuned Postgres config (used by docker-compose.db.yml for primary and replica).
# Everything not listed here keeps its default value.
# The Docker VM has 4 GB for EVERYTHING (Redis, APIs, k6, both Postgres). Postgres gets about half.

listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
max_connections = 100

# --- memory
shared_buffers = 384MB              # default 128MB: Postgres' own page cache (x2: primary + replica)
effective_cache_size = 1536MB       # planner hint: how much the OS caches too
work_mem = 8MB                      # per sort / hash; our queries are tiny
maintenance_work_mem = 256MB        # faster VACUUM and index builds

# --- planner (SSD)
random_page_cost = 1.1              # a random read is almost as cheap as a sequential one (default 4.0)
effective_io_concurrency = 200      # SSD serves many reads at once (bitmap heap scans)

# --- WAL / checkpoints (write-heavy: 1K likes/s + sync worker upserts)
max_wal_size = 4GB                  # fewer checkpoints during write bursts (default 1GB)
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9  # spread checkpoint writes over time: no I/O spikes
wal_compression = on                # full-page images in WAL are compressed: less WAL

# --- replication
wal_level = replica
max_wal_senders = 5
wal_keep_size = 2GB                 # the replica may fall behind a bit and still catch up
hot_standby = on                    # replica answers reads (ignored on the primary)
hot_standby_feedback = on           # long reads on the replica do not get cancelled by VACUUM

# --- dead clients
# The API gives up on a query after 200 ms; PgBouncer then closes its server connection.
# Without this check the backend keeps running (or waiting on a lock) and still holds one of
# the 100 slots -> PgBouncer opens a new one -> after a minute all slots are taken by "zombie"
# backends and EVERY query fails with "too many clients". We saw exactly this under overload.
client_connection_check_interval = 250ms

# --- observability
track_io_timing = on                # EXPLAIN (BUFFERS) shows time spent on I/O
log_min_duration_statement = 200ms  # log slow queries (above our 200 ms timeout)
