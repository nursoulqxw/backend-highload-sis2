// Contract for the T7 Like & View Counter service.
// Code is generated from this file with: make proto
syntax = "proto3";

package counter.v1;

service CounterService {
  rpc LikePost(LikeRequest) returns (Empty);
  rpc UnlikePost(LikeRequest) returns (Empty);
  rpc RecordView(ViewRequest) returns (Empty);
  // Many views in one call. The API Gateway collects views for ~50 ms and sends them
  // together: 20K views/s = 200 calls/s of 100 views, instead of 20K calls/s.
  // Idempotent: each (user, post) is deduped, so the whole batch may be retried.
  rpc RecordViews(RecordViewsRequest) returns (RecordViewsResponse);
  rpc GetCounters(GetCountersRequest) returns (GetCountersResponse);
}

message Empty {}

message LikeRequest {
  int64 user_id = 1;
  int64 post_id = 2;
}

message ViewRequest {
  int64 user_id = 1;
  int64 post_id = 2;
}

message RecordViewsRequest {
  repeated ViewRequest views = 1;  // 1..1000 views
}

message RecordViewsResponse {
  int32 counted = 1;  // new views; the rest were duplicates (same user + post within 1 hour)
}

message GetCountersRequest {
  int64 user_id = 1;            // 0 = no user, liked_by_me is false
  repeated int64 post_ids = 2;  // 1..100 ids
}

message PostCounter {
  int64 post_id = 1;
  int64 likes = 2;
  int64 views = 3;
  bool liked_by_me = 4;
}

message GetCountersResponse {
  repeated PostCounter counters = 1;
}
