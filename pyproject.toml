# Code style: run `ruff check .` (lint) and `ruff format .` (formatting).
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/grpc_api/generated"]  # generated by protoc, not written by hand

[tool.ruff.lint]
# E/W = PEP 8 style, F = errors (unused imports, ...), I = sorted imports,
# N = PEP 8 naming, B = common bugs, UP = modern Python syntax, SIM = simpler code
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# gRPC requires method names from the .proto file (LikePost, GetCounters, ...).
"app/grpc_api/server.py" = ["N802"]
